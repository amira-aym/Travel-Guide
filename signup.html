<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign Up - Travel Guide</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?auto=format&fit=crop&w=1500&q=80');
            background-size: cover;
            background-position: center;
            filter: blur(6px);
            z-index: -1;
            transform: scale(1.05);
        }
        .auth-container { 
            max-width: 450px; 
            width: 100%;
            background: rgba(255, 255, 255, 0.95); 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.3); 
        }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center">
        <div class="auth-container text-center">
            <h2 class="fw-bold mb-4">Create an Account</h2>
            <form>
                <div class="mb-3 text-start">
                    <label for="fullName" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="fullName" placeholder="John Doe" required>
                </div>
                <div class="mb-3 text-start">
                    <label for="age" class="form-label">Age</label>
                    <input type="number" class="form-control" id="age" placeholder="e.g. 25" min="13" required>
                </div>
                <div class="mb-3 text-start">
                    <label for="email" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                </div>
                <div class="mb-4 text-start">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="Create a strong password" required>
                </div>
                <div class="mb-4 form-check text-start">
                    <input type="checkbox" class="form-check-input" id="terms" required>
                    <label class="form-check-label text-muted small" for="terms">I agree to the Terms of Service and Privacy Policy</label>
                </div>

                <button type="submit" class="btn btn-primary w-100 fw-bold rounded-pill mb-3">Sign Up</button>
            </form>
            
            <div class="d-flex align-items-center mb-3">
                <hr class="flex-grow-1">
                <span class="px-2 text-muted small">OR</span>
                <hr class="flex-grow-1">
            </div>

            <button class="btn btn-outline-dark w-100 rounded-pill fw-semibold">
                <i class="bi bi-google me-2 text-danger"></i> Sign up with Google
            </button>

            <div class="mt-4">
                <p class="mb-0 text-muted">Already have an account? <a href="signin.html" class="text-decoration-none fw-bold text-primary">Sign In</a></p>
                <a href="index.html" class="text-decoration-none small text-muted d-block mt-3"><i class="bi bi-arrow-left"></i> Back to Home</a>
            </div>
        </div>
    </div>
</body>
</html>
