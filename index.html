 <!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lonely Planet Navbar</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="./css/style.css">
  </head>
  <body>
    
    <!-- Start Navbar -->
    <nav class="navbar navbar-expand-lg bg-white position-sticky top-0 start-0 end-0 border-bottom z-3">
        <div class="container-fluid px-4">

            <!-- Logo -->
            <a class="navbar-brand logo fw-bold text-dark fs-3" href="#">lonely planet</a>

            <!-- Toggler Button for Mobile -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Navbar Content -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <!-- Center Links -->
                <ul class="navbar-nav nav-links mx-auto mb-2 mb-lg-0 align-items-center">
                    <li class="nav-item">
                        <a class="nav-link text-dark fw-semibold px-3" href="#">DESTINATIONS</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-dark fw-semibold px-3" href="#">BOOKS</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-dark fw-semibold px-3" href="#">TRIPS</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-dark fw-semibold px-3" href="#">INSPIRATION</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-dark px-2" href="#"><i class="bi bi-search"></i></a>
                    </li>
                </ul>

                <!-- Right Links -->
                <div class="d-flex align-items-center right-links gap-3">
                    <a href="#" class="nav-link text-dark fw-semibold"><i class="bi bi-cart3"></i> CART</a>
                    <a href="#" class="nav-link text-dark fw-semibold">SIGN IN</a>
                </div>
            </div>

        </div>
    </nav>
    <!-- End Navbar -->

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
