<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign In - Travel Guide</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?auto=format&fit=crop&w=1500&q=80');
            background-size: cover;
            background-position: center;
            filter: blur(6px);
            z-index: -1;
            transform: scale(1.05);
        }
        .auth-container { 
            max-width: 400px; 
            width: 100%;
            background: rgba(255, 255, 255, 0.95); 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.3); 
        }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center">
        <div class="auth-container text-center">
            <h2 class="fw-bold mb-4">Sign In</h2>
            <form id="authForm" novalidate>
                <div class="mb-3 text-start">
                    <label for="email" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                </div>
                <div class="mb-4 text-start">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group has-validation">
                            <input type="password" class="form-control" id="password" placeholder="Enter password" required>
                            <button class="btn btn-outline-secondary toggle-password" type="button"><i class="bi bi-eye"></i></button>
                            <div class="invalid-feedback">Password must be at least 8 characters long and contain at least one special character (e.g., #, @, $).</div>
                        </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-bold rounded-pill mb-3">Sign In</button>
            </form>
            
            <div class="d-flex align-items-center mb-3">
                <hr class="flex-grow-1">
                <span class="px-2 text-muted small">OR</span>
                <hr class="flex-grow-1">
            </div>

            <button type="button" class="btn btn-outline-dark w-100 rounded-pill fw-semibold" onclick="simulateGoogleLogin(event)"><i class="bi bi-google me-2 text-danger"></i> Sign in with Google</button>

            <div class="mt-4">
                <p class="mb-0 text-muted">Don't have an account? <a href="signup.html" class="text-decoration-none fw-bold text-primary">Sign Up</a></p>
                <a href="index.html" class="text-decoration-none small text-muted d-block mt-3"><i class="bi bi-arrow-left"></i> Back to Home</a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const form = document.getElementById('authForm');
            const passwordInput = document.getElementById('password');

            form.addEventListener('submit', function (event) {
                // Prevent default submission for validation
                event.preventDefault();
                event.stopPropagation();

                let isValid = true;
                
                // Regular expression for password: at least 8 chars, at least 1 special character
                const passwordRegex = /^(?=.*[!@#$%^&*(),.?":{}|<>]).{8,}$/;

                if (!passwordRegex.test(passwordInput.value)) {
                    passwordInput.classList.add('is-invalid');
                    passwordInput.classList.remove('is-valid');
                    isValid = false;
                } else {
                    passwordInput.classList.remove('is-invalid');
                    passwordInput.classList.add('is-valid');
                }

                // Mock login success
                    if(isValid) {
                        localStorage.setItem('isLoggedIn', 'true');
                        window.location.href = 'index.html';
                    }
                    
                if (!form.checkValidity()) {
                    isValid = false;
                }
                
                form.classList.add('was-validated');

                if (isValid) {
                    // form.submit();
                    alert("Form submitted successfully!");
                }
            }, false);
            
            // Real-time validation on input
            passwordInput.addEventListener('input', function() {
                const passwordRegex = /^(?=.*[!@#$%^&*(),.?":{}|<>]).{8,}$/;
                if (passwordRegex.test(passwordInput.value)) {
                    passwordInput.classList.remove('is-invalid');
                    passwordInput.classList.add('is-valid');
                } else {
                    passwordInput.classList.add('is-invalid');
                    passwordInput.classList.remove('is-valid');
                }
            });
        });
    </script>


<script>
document.addEventListener('DOMContentLoaded', function() {
    const toggleBtns = document.querySelectorAll('.toggle-password');
    toggleBtns.forEach(btn => {
        btn.addEventListener('click', function() {
            const input = this.previousElementSibling;
            const icon = this.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('bi-eye');
                icon.classList.add('bi-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('bi-eye-slash');
                icon.classList.add('bi-eye');
            }
        });
    });
});
</script>

<script>
    function simulateGoogleLogin(event) {
        event.preventDefault();
        const btn = event.currentTarget;
        
        // No custom prompt, just simulate immediate login to act like a seamless OAuth
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span> Authenticating...';
        btn.disabled = true;
        
        setTimeout(() => {
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('loginType', 'google');
            // We use 'Amira' or 'User' as default since we can't pull real Google data without backend
            if(!localStorage.getItem('googleName')) {
                localStorage.setItem('googleName', 'Amira');
            }
            window.location.href = 'index.html';
        }, 1500);
    }
</script>

</body>

</html>
